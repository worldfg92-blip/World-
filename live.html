<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldFG - Live Streaming</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .live-container { max-width: 500px; margin: 0 auto; padding: 16px; }
        .live-screen { position: relative; width: 100%; background: #000; border-radius: 16px; overflow: hidden; margin-bottom: 16px; }
        .live-screen video { width: 100%; height: auto; display: block; border-radius: 16px; }
        .live-offline { width: 100%; height: 500px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a1a2e, #16213e); border-radius: 16px; flex-direction: column; }
        .live-badge-top { position: absolute; top: 12px; left: 12px; background: #ef4444; color: white; padding: 4px 12px; border-radius: 16px; font-size: 12px; font-weight: 700; z-index: 10; animation: pulse 1.5s infinite; display: flex; align-items: center; gap: 6px; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        .viewer-count { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6); color: white; padding: 4px 12px; border-radius: 16px; font-size: 12px; z-index: 10; display: flex; align-items: center; gap: 6px; }
        .live-comments-area { position: absolute; bottom: 0; left: 0; right: 0; padding: 80px 12px 12px 12px; background: linear-gradient(transparent, rgba(0,0,0,0.7)); z-index: 5; max-height: 200px; overflow-y: auto; }
        .live-comment { color: white; font-size: 12px; margin: 2px 0; text-shadow: 0 1px 2px rgba(0,0,0,0.8); animation: slideUp 0.3s; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .live-comment strong { color: #f59e0b; }
        .floating-emoji { position: absolute; animation: floatUp 2s forwards; font-size: 24px; pointer-events: none; z-index: 15; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-200px) scale(1.5); } }
        .live-controls { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .live-btn { flex: 1; padding: 14px; border-radius: 12px; border: none; cursor: pointer; font-weight: 700; font-size: 15px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 100px; }
        .btn-go-live { background: #ef4444; color: white; }
        .btn-go-live:hover { background: #dc2626; transform: scale(1.02); }
        .btn-stop-live { background: #64748b; color: white; }
        .btn-flip { background: var(--card); color: white; border: 1px solid var(--border); }
        .emoji-bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
        .emoji-btn { font-size: 28px; background: var(--card); border: 1px solid var(--border); border-radius: 50%; width: 50px; height: 50px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .emoji-btn:hover { transform: scale(1.2); background: var(--hover); }
        .comment-input-row { display: flex; gap: 8px; margin-top: 12px; }
        .comment-input-row input { flex: 1; padding: 12px 16px; border-radius: 24px; background: var(--dark); border: 1px solid var(--border); color: #e2e8f0; outline: none; font-size: 14px; }
        .comment-input-row button { padding: 12px 20px; border-radius: 24px; background: var(--primary); color: white; border: none; cursor: pointer; font-weight: 600; }
        .start-screen { text-align: center; padding: 40px; }
        .start-screen i { font-size: 80px; color: #ef4444; margin-bottom: 20px; }
        .start-screen h2 { margin-bottom: 8px; }
        .start-screen p { color: #94a3b8; margin-bottom: 24px; }
    </style>
</head>
<body>
    <header class="platform-header">
        <a href="home.html" class="platform-logo">🌍 WorldFG</a>
        <div class="nav-icons">
            <a href="home.html" class="nav-icon"><i class="fas fa-home"></i></a>
            <a href="friends.html" class="nav-icon"><i class="fas fa-user-friends"></i></a>
            <a href="marketplace.html" class="nav-icon"><i class="fas fa-store"></i></a>
            <a href="live.html" class="nav-icon active"><i class="fas fa-video"></i></a>
            <a href="messages.html" class="nav-icon"><i class="fas fa-comment-dots"></i></a>
        </div>
        <a href="profile.html" class="user-menu-trigger"><div class="user-avatar-small" id="headerAvatar">U</div><span id="headerUserName">User</span></a>
    </header>

    <div class="live-container">
        <h1 style="margin-bottom:16px; display:flex; align-items:center; gap:8px;"><span class="live-indicator"></span> Live Streaming</h1>

        <!-- Live Screen -->
        <div class="live-screen" id="liveScreen">
            <div class="live-offline" id="liveOffline">
                <div class="start-screen">
                    <i class="fas fa-video"></i>
                    <h2>Go Live Now</h2>
                    <p>Broadcast to the world! Your followers will see you live.</p>
                    <button class="live-btn btn-go-live" onclick="startLiveStream()" style="width:auto; display:inline-flex;">
                        <i class="fas fa-broadcast-tower"></i> Start Live Stream
                    </button>
                </div>
            </div>
            <video id="liveVideo" autoplay muted playsinline style="display:none;"></video>
            <div class="live-badge-top" id="liveBadge" style="display:none;">
                <span style="width:8px;height:8px;background:white;border-radius:50%;animation:pulse 1.5s infinite;"></span> LIVE
            </div>
            <div class="viewer-count" id="viewerCount" style="display:none;">
                <i class="fas fa-eye"></i> <span id="viewerNumber">0</span> watching
            </div>
            <div class="live-comments-area" id="liveCommentsArea"></div>
        </div>

        <!-- Floating emojis container -->
        <div id="floatingEmojis" style="position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:20;"></div>

        <!-- Controls -->
        <div class="live-controls" id="liveControls" style="display:none;">
            <button class="live-btn btn-stop-live" onclick="stopLiveStream()"><i class="fas fa-stop"></i> End Stream</button>
            <button class="live-btn btn-flip" onclick="flipCamera()"><i class="fas fa-sync-alt"></i> Flip Camera</button>
        </div>

        <!-- Emoji reactions -->
        <div class="emoji-bar" id="emojiBar" style="display:none;">
            <button class="emoji-btn" onclick="sendReaction('❤️')">❤️</button>
            <button class="emoji-btn" onclick="sendReaction('👍')">👍</button>
            <button class="emoji-btn" onclick="sendReaction('😂')">😂</button>
            <button class="emoji-btn" onclick="sendReaction('😮')">😮</button>
            <button class="emoji-btn" onclick="sendReaction('🔥')">🔥</button>
            <button class="emoji-btn" onclick="sendReaction('👏')">👏</button>
            <button class="emoji-btn" onclick="sendReaction('🎉')">🎉</button>
            <button class="emoji-btn" onclick="sendReaction('💯')">💯</button>
        </div>

        <!-- Comment input -->
        <div class="comment-input-row" id="commentRow" style="display:none;">
            <input type="text" id="liveCommentInput" placeholder="Add a comment..." onkeypress="if(event.key==='Enter')sendComment()">
            <button onclick="sendComment()">Send</button>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        var mediaStream = null;
        var isLive = false;
        var viewerCount = 0;
        var viewerInterval = null;
        var facingMode = 'user'; // 'user' for front camera, 'environment' for back camera

        var fakeCommenters = ['Alex', 'Maria', 'John', 'Fatima', 'David', 'Priya', 'Carlos', 'Amina', 'Wei', 'Sarah'];
        var fakeComments = [
            'Hello from Nigeria! 🇳🇬', 'Love your stream! ❤️', 'You look amazing! 🔥',
            'Greetings from Kenya! 👋', 'Keep going! 💪', 'This is awesome! 🎉',
            'Watching from Ghana! 🌍', 'You are the best! 👏', 'So entertaining! 😍',
            'Hello from USA! 🇺🇸', 'Much love from India! 🇮🇳', 'Great content! 💯',
            'Watching from Brazil! 🇧🇷', 'You inspire me! ✨', 'Hello from UK! 🇬🇧'
        ];

        function startLiveStream() {
            console.log('Starting live stream...');
            
            // Check if browser supports camera
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('❌ Your browser does not support camera access. Please use Chrome, Firefox, or Safari.');
                return;
            }

            // Request camera access
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: facingMode, width: { ideal: 720 }, height: { ideal: 1280 } }, 
                audio: true 
            })
            .then(function(stream) {
                console.log('Camera access granted!');
                mediaStream = stream;
                
                // Show video
                var video = document.getElementById('liveVideo');
                video.srcObject = stream;
                video.style.display = 'block';
                video.play();
                
                // Hide offline screen
                document.getElementById('liveOffline').style.display = 'none';
                
                // Show live elements
                document.getElementById('liveBadge').style.display = 'flex';
                document.getElementById('viewerCount').style.display = 'flex';
                document.getElementById('liveControls').style.display = 'flex';
                document.getElementById('emojiBar').style.display = 'flex';
                document.getElementById('commentRow').style.display = 'flex';
                
                isLive = true;
                
                // Start viewer count
                viewerCount = Math.floor(Math.random() * 50) + 5;
                updateViewerCount();
                viewerInterval = setInterval(function() {
                    viewerCount += Math.floor(Math.random() * 5) - 2;
                    if (viewerCount < 1) viewerCount = 1;
                    updateViewerCount();
                }, 3000);
                
                // Start fake comments
                startFakeComments();
                
                // Add notification
                if (typeof addNotification === 'function') {
                    addNotification('🔴 Live', 'You are now live! Viewers are joining.');
                }
                
                alert('🔴 YOU ARE NOW LIVE!\n\n📊 Viewers: ' + viewerCount + '\n💬 Viewers can comment and send emojis\n🌍 The world can see you now!');
            })
            .catch(function(err) {
                console.error('Camera error:', err);
                alert('❌ Camera access denied!\n\nPlease allow camera access in your browser settings to go live.\n\nError: ' + err.message);
            });
        }

        function stopLiveStream() {
            if (!confirm('End your live stream?')) return;
            
            // Stop all tracks
            if (mediaStream) {
                mediaStream.getTracks().forEach(function(track) {
                    track.stop();
                });
                mediaStream = null;
            }
            
            // Hide video
            var video = document.getElementById('liveVideo');
            video.srcObject = null;
            video.style.display = 'none';
            
            // Show offline screen
            document.getElementById('liveOffline').style.display = 'flex';
            
            // Hide live elements
            document.getElementById('liveBadge').style.display = 'none';
            document.getElementById('viewerCount').style.display = 'none';
            document.getElementById('liveControls').style.display = 'none';
            document.getElementById('emojiBar').style.display = 'none';
            document.getElementById('commentRow').style.display = 'none';
            
            // Clear comments
            document.getElementById('liveCommentsArea').innerHTML = '';
            
            // Stop intervals
            if (viewerInterval) clearInterval(viewerInterval);
            
            isLive = false;
            
            alert('✅ Live stream ended!\n\nTotal viewers: ' + viewerCount);
            
            if (typeof addNotification === 'function') {
                addNotification('🔴 Live', 'Your live stream ended with ' + viewerCount + ' viewers.');
            }
        }

        function flipCamera() {
            if (!mediaStream) return;
            
            // Stop current stream
            mediaStream.getTracks().forEach(function(track) {
                track.stop();
            });
            
            // Toggle facing mode
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            
            // Get new stream
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: facingMode, width: { ideal: 720 }, height: { ideal: 1280 } }, 
                audio: true 
            })
            .then(function(stream) {
                mediaStream = stream;
                var video = document.getElementById('liveVideo');
                video.srcObject = stream;
                video.play();
                alert('📷 Camera flipped to ' + (facingMode === 'user' ? 'Front Camera' : 'Back Camera'));
            })
            .catch(function(err) {
                alert('❌ Could not flip camera: ' + err.message);
            });
        }

        function updateViewerCount() {
            document.getElementById('viewerNumber').textContent = viewerCount;
        }

        function sendComment() {
            var input = document.getElementById('liveCommentInput');
            var text = input.value.trim();
            if (!text) return;
            
            addLiveComment('You', text);
            input.value = '';
        }

        function addLiveComment(name, text) {
            var area = document.getElementById('liveCommentsArea');
            var comment = document.createElement('div');
            comment.className = 'live-comment';
            comment.innerHTML = '<strong>' + name + ':</strong> ' + text;
            area.appendChild(comment);
            area.scrollTop = area.scrollHeight;
            
            // Remove old comments if too many
            while (area.children.length > 30) {
                area.removeChild(area.firstChild);
            }
        }

        function sendReaction(emoji) {
            if (!isLive) return;
            
            // Add floating emoji on screen
            var screen = document.getElementById('liveScreen');
            var floatingEmoji = document.createElement('div');
            floatingEmoji.className = 'floating-emoji';
            floatingEmoji.textContent = emoji;
            floatingEmoji.style.left = Math.random() * 80 + 10 + '%';
            floatingEmoji.style.bottom = '100px';
            screen.appendChild(floatingEmoji);
            
            // Remove after animation
            setTimeout(function() {
                if (floatingEmoji.parentElement) {
                    floatingEmoji.parentElement.removeChild(floatingEmoji);
                }
            }, 2000);
            
            // Add to comments
            addLiveComment('You', 'sent ' + emoji);
        }

        function startFakeComments() {
            if (!isLive) return;
            
            var randomDelay = Math.floor(Math.random() * 5000) + 2000;
            
            setTimeout(function() {
                if (!isLive) return;
                
                var commenter = fakeCommenters[Math.floor(Math.random() * fakeCommenters.length)];
                var comment = fakeComments[Math.floor(Math.random() * fakeComments.length)];
                addLiveComment(commenter, comment);
                
                // Sometimes send a reaction
                if (Math.random() > 0.5) {
                    var emojis = ['❤️', '👍', '😂', '🔥', '👏', '🎉', '💯', '😍'];
                    var emoji = emojis[Math.floor(Math.random() * emojis.length)];
                    var screen = document.getElementById('liveScreen');
                    var floatingEmoji = document.createElement('div');
                    floatingEmoji.className = 'floating-emoji';
                    floatingEmoji.textContent = emoji;
                    floatingEmoji.style.left = Math.random() * 80 + 10 + '%';
                    floatingEmoji.style.bottom = '100px';
                    screen.appendChild(floatingEmoji);
                    setTimeout(function() {
                        if (floatingEmoji.parentElement) floatingEmoji.parentElement.removeChild(floatingEmoji);
                    }, 2000);
                }
                
                startFakeComments(); // Continue loop
            }, randomDelay);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            var user = getCurrentUser();
            if (user) {
                document.getElementById('headerUserName').textContent = user.firstName || 'User';
                if (user.profilePic) {
                    document.getElementById('headerAvatar').innerHTML = '<img src="' + user.profilePic + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">';
                }
            }
            console.log('Live page ready. Click "Start Live Stream" to begin!');
        });
    </script>
</body>
</html>
