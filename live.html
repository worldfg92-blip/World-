<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldFG - Live Streaming</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="platform-header">
        <a href="home.html" class="platform-logo">🌍 WorldFG</a>
        <div class="nav-icons">
            <a href="home.html" class="nav-icon"><i class="fas fa-home"></i></a>
            <a href="friends.html" class="nav-icon"><i class="fas fa-user-friends"></i></a>
            <a href="marketplace.html" class="nav-icon"><i class="fas fa-store"></i></a>
            <a href="live.html" class="nav-icon active"><i class="fas fa-video"></i></a>
            <a href="messages.html" class="nav-icon"><i class="fas fa-comment-dots"></i></a>
        </div>
        <a href="profile.html" class="user-menu-trigger">
            <div class="user-avatar-small" id="headerAvatar">U</div>
            <span id="headerUserName">User</span>
        </a>
    </header>

    <div style="max-width:800px; margin:16px auto; padding:0 16px;">
        <h1 style="margin-bottom:16px;"><span class="live-indicator"></span> Live Streaming</h1>
        
        <div class="card-widget" style="text-align:center; padding:40px;">
            <i class="fas fa-video" style="font-size:60px; color:var(--danger);"></i>
            <h2 style="margin:16px 0;">Go Live Now</h2>
            <p style="color:#94a3b8;">Broadcast to your followers and the world!</p>
            <button onclick="startLiveStream()" style="background:var(--danger); color:white; border:none; padding:16px 40px; border-radius:12px; cursor:pointer; font-size:18px; margin-top:16px;">
                🔴 Start Live Stream
            </button>
        </div>
        
        <div class="card-widget" style="margin-top:16px;">
            <h3>Live Now</h3>
            <div id="liveStreams">
                <p style="padding:12px; color:#94a3b8;">🎵 DJ Mix Show • 1.2K watching</p>
                <p style="padding:12px; color:#94a3b8;">🎮 Gaming Tournament • 856 watching</p>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
        function startLiveStream() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                    .then(stream => {
                        alert('🔴 LIVE NOW!\n\nYou are broadcasting to the world!\nViewers: ' + Math.floor(Math.random() * 500));
                        addNotification('🔴 Live', 'You started a live stream!');
                    })
                    .catch(() => {
                        alert('🔴 LIVE STREAM ACTIVE!\nViewers: ' + Math.floor(Math.random() * 200));
                        addNotification('🔴 Live', 'Live stream started');
                    });
            } else {
                alert('🔴 LIVE STREAM ACTIVE!\nViewers: ' + Math.floor(Math.random() * 300));
                addNotification('🔴 Live', 'Live stream started');
            }
        }
        initPage();
    </script>
</body>
</html>
