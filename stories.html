<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldFG - Stories</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="platform-header">
        <a href="home.html" class="platform-logo">🌍 WorldFG</a>
        <div class="nav-icons">
            <a href="home.html" class="nav-icon"><i class="fas fa-home"></i></a>
            <a href="friends.html" class="nav-icon"><i class="fas fa-user-friends"></i></a>
            <a href="marketplace.html" class="nav-icon"><i class="fas fa-store"></i></a>
            <a href="live.html" class="nav-icon"><i class="fas fa-video"></i></a>
            <a href="messages.html" class="nav-icon"><i class="fas fa-comment-dots"></i></a>
        </div>
        <a href="profile.html" class="user-menu-trigger">
            <div class="user-avatar-small" id="headerAvatar">U</div>
            <span id="headerUserName">User</span>
        </a>
    </header>

    <div style="max-width:800px; margin:16px auto; padding:0 16px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <h1>📸 Stories</h1>
            <button onclick="createStory()" style="background:var(--primary); color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer;">
                <i class="fas fa-plus"></i> Add Story
            </button>
        </div>
        
        <div class="stories-container" id="allStories" style="flex-wrap:wrap; gap:12px;"></div>
        
        <input type="file" id="storyUpload" accept="image/*" style="display:none;" onchange="uploadStory(event)">
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
        function renderAllStories() {
            const container = document.getElementById('allStories');
            const currentUser = getCurrentUser();
            
            let html = `
                <div class="story-circle" onclick="document.getElementById('storyUpload').click()" style="background:var(--card); display:flex; align-items:center; justify-content:center; width:120px; height:180px;">
                    <div style="text-align:center;">
                        <i class="fas fa-plus-circle" style="font-size:30px; color:var(--primary);"></i>
                        <p style="font-size:12px; margin-top:8px;">Add Story</p>
                    </div>
                </div>
            `;
            
            if (DB.stories) {
                DB.stories.forEach(story => {
                    html += `
                        <div class="story-circle" style="width:120px; height:180px;" onclick="viewStory('${story.id}')">
                            ${story.mediaUrl ? `<img src="${story.mediaUrl}" style="width:100%;height:100%;object-fit:cover;">` : ''}
                            <div class="story-user">${story.userName}</div>
                        </div>
                    `;
                });
            }
            
            container.innerHTML = html || '<p>No stories yet</p>';
        }
        
        function createStory() {
            document.getElementById('storyUpload').click();
        }
        
        function uploadStory(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const story = {
                    id: 'story_' + Date.now(),
                    userId: getCurrentUser().id,
                    userName: getCurrentUser().fullName,
                    mediaUrl: e.target.result,
                    time: new Date().toISOString(),
                    views: []
                };
                if (!DB.stories) DB.stories = [];
                DB.stories.unshift(story);
                saveDB();
                renderAllStories();
                addNotification('📸 Story', 'Story created!');
            };
            reader.readAsDataURL(file);
        }
        
        function viewStory(storyId) {
            const story = DB.stories.find(s => s.id === storyId);
            if (!story) return;
            alert('📸 Viewing story by ' + story.userName + '\n\nPosted: ' + timeAgo(story.time));
        }
        
        renderAllStories();
        initPage();
    </script>
</body>
</html>
